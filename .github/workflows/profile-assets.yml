name: Profile assets (stats + streak + snake)

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer deps
        run: pip install --quiet fonttools

      - name: Build streak card from live contribution data
        id: streak
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python tools/streak.py dist lokeshe09

      - name: Build analytics panel from live data
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python tools/stats.py dist lokeshe09

      - name: Build 3D contribution calendar from live data
        id: contrib3d
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python tools/contrib3d.py dist lokeshe09

      - name: Keep the committed cards if a live build failed
        run: |
          mkdir -p dist
          [ -f dist/streak-dark.svg ]    || { cp assets/streak-dark.svg    assets/streak-light.svg    dist/; echo "::warning::Streak build failed - kept committed card. Add a GH_PAT secret (read:user) if this persists."; }
          [ -f dist/stats-dark.svg ]     || { cp assets/stats-dark.svg     assets/stats-light.svg     dist/; echo "::warning::Stats build failed - kept committed card."; }
          [ -f dist/contrib3d-dark.svg ] || { cp assets/contrib3d-dark.svg assets/contrib3d-light.svg dist/; echo "::warning::3D calendar build failed - kept committed card."; }
          ls -la dist

      - name: Rebuild the interactive site (docs/) with the fresh cards
        run: |
          cp dist/stats-*.svg dist/streak-*.svg dist/contrib3d-*.svg assets/
          python tools/build_site.py assets docs

      - name: Commit refreshed live cards + site to main (so the README never 404s)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/streak-*.svg assets/contrib3d-*.svg docs/
          git diff --cached --quiet || { git commit -m "chore: refresh live profile cards [skip ci]"; git push; }

