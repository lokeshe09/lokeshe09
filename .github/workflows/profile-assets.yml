name: Profile assets (streak + snake)

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build streak card from live contribution data
        id: streak
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet fonttools
          python tools/streak.py dist lokeshe09

      - name: Fall back to the committed streak card
        if: steps.streak.outcome == 'failure'
        run: |
          mkdir -p dist
          cp assets/streak-dark.svg assets/streak-light.svg dist/
          echo "::warning::Live streak build failed — published the committed fallback. Add a GH_PAT secret (read:user) if this persists."

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: lokeshe09
          outputs: |
            dist/github-snake.svg?color_snake=%2316A34A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%232AE86D

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
